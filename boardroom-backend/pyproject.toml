[project]
name = "boardroom-backend"
version = "0.1.0"
description = "LangGraph-orchestrated AI VPs powering the boardroom virtual-business platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "claude-agent-sdk>=0.1.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "websockets>=13.0",
    "supabase>=2.9.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boardroom"]
